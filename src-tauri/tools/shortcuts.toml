keywords = "modo seguro inicio avanzado recuperacion reparar reiniciar"

[[tool]]
id = "boot-restart"
name = "Reiniciar ahora"
description = "Reinicia el equipo inmediatamente."
group = "boot"
icon = "refresh"
run = "{System32}\\shutdown.exe"
args = "/r /t 0"
hidden = true
confirm = "El equipo se reiniciará ahora mismo. Guarda antes todo lo abierto."
keywords = "reiniciar restart"

[[tool]]
id = "recoverydrive"
name = "Crear unidad de recuperación"
description = "USB de recuperación para reparar o reinstalar Windows."
group = "boot"
icon = "usb"
run = "{System32}\\RecoveryDrive.exe"
keywords = "unidad recuperacion usb"

# ---------- Asistencia remota ----------

[[tool]]
id = "quickassist"
name = "Asistencia rápida"
description = "Ayuda o recibe ayuda remota con una cuenta de Microsoft."
group = "remote"
icon = "handshake"
run = "{System32}\\quickassist.exe"
requires = "{System32}\\quickassist.exe"
keywords = "asistencia rapida remoto quick assist"

[[tool]]
id = "msra"
name = "Asistencia remota de Windows"
description = "msra: invitar a alguien de confianza a conectarse."
group = "remote"
icon = "handshake"
run = "{System32}\\msra.exe"
requires = "{System32}\\msra.exe"
keywords = "msra asistencia remota"

[[tool]]
id = "mstsc"
name = "Escritorio remoto"
description = "mstsc: conectarse a otro equipo por RDP."
group = "remote"
icon = "monitor"
run = "{System32}\\mstsc.exe"
keywords = "mstsc rdp escritorio remoto"

[[tool]]
id = "set-remotedesktop"
name = "Permitir escritorio remoto"
description = "Activar el acceso por RDP a este equipo (Windows Pro)."
group = "remote"
icon = "settings"
open = "ms-settings:remotedesktop"
keywords = "rdp escritorio remoto permitir"
