# Accesos rápidos de la página Herramientas. Se incrustan en el binario al compilar.
#
# Cómo se abre cada acceso:
#   open    = ruta, carpeta shell: o URI (ms-settings:…). La abre el Explorador
#             del usuario con la sesión abierta, sin permisos de administrador.
#   run     = programa. Se lanza con los permisos de AdminOps (administrador).
#     args     argumentos fijos.
#     elevate  pide administrador aunque AdminOps no lo sea (verbo "runas").
#     as_user  lo lanza el Explorador como el usuario, sin administrador (sin args).
#     hidden   se ejecuta sin ventana y muestra el error si falla (reinicios).
#   admin    = true si no sirve de nada sin administrador (la UI lo desactiva).
#   requires = archivo que debe existir; si no, el acceso aparece como no disponible
#              (p. ej. gpedit.msc no existe en Windows Home).
#   confirm  = texto de confirmación antes de ejecutar.
#
# Variables: {System32} {Windows} {ProgramData} {ProgramFiles}
#            {UserProfile} {UserAppData} {UserLocalAppData} {UserTemp}
# Grupos: console admin diag panel settings folders boot remote

# ---------- Consolas ----------

[[tool]]
id = "cmd"
name = "Símbolo del sistema"
description = "CMD como el usuario del equipo, sin administrador."
group = "console"
icon = "terminal"
run = "{System32}\\cmd.exe"
as_user = true
keywords = "cmd consola terminal"

[[tool]]
