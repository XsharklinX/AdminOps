# Perfiles: conjuntos de ajustes y tareas que se aplican de una vez, con un
# único punto de restauración. Cada elemento queda en el diario por separado,
# así que el perfil se puede deshacer entero o ajuste por ajuste.
# icon: nombre de un icono de lucide (ver src/pages/Profiles.tsx).

[[profile]]
id = "office"
name = "Oficina"
icon = "briefcase"
description = "Equipo de trabajo: sin anuncios ni distracciones, Edge y Widgets fuera del segundo plano y apagados completos para evitar problemas de drivers y actualizaciones. No toca impresión ni búsqueda."
items = [
  "privacy.advertising-id",
  "privacy.tailored-experiences",
  "privacy.start-suggestions",
  "privacy.lockscreen-ads",
  "privacy.feedback",
  "privacy.bing-search",
  "performance.edge-background",
  "performance.widgets",
  "performance.fast-startup",
  "cleanup.user-temp",
]

