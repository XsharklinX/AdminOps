[package]
name = "adminops"
version = "1.1.7"
description = "AdminOps - optimizacion y diagnostico de Windows"
authors = ["David Bonilla"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "adminops_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# "unstable": vistas web hijas (portales de Tickets incrustados en la ventana).
tauri = { version = "2", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"
toml = "1.1.6"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
tauri-plugin-log = "2.9.2"
log = "0.4.34"
futures-util = "0.3.34"
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["time", "sync", "macros", "rt"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "stream", "json", "http2"] }
bytes = "1.12.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate"] }
sha2 = "0.11"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
aes-gcm = "0.10"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# "unwind": un fallo inesperado en un comando no cierra la app (se anota en el registro).
panic = "unwind"
strip = true

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_NetManagement", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Credentials", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_Storage_Vhd", "Win32_System_DataExchange", "Win32_System_EventLog", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.56.0"
# Mismas versiones que usa Tauri: activar "recordar contraseña" en los portales de Tickets.
webview2-com = "0.38.2"
windows = { version = "0.61", features = ["ApplicationModel_DataTransfer", "Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.61.2"
# Avisos con botones (la misma que usa el plugin de notificaciones por debajo).
tauri-winrt-notification = "0.7.3"
