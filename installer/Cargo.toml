[package]
name = "adminops-setup"
# La versión que se instala sale de src-tauri/tauri.conf.json (ver build.rs).
version = "1.0.0"
description = "Instalador de AdminOps"
authors = ["David Bonilla"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"
sha2 = "0.11"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"
# Comprobar que el adminops.exe instalado es el de este instalador.
sha2 = "0.11"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"
# Restart Manager: quién tiene abiertos los archivos de AdminOps, para cerrarlo antes de copiar.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_RestartManager", "Win32_System_Threading"] }

[features]
# La activa scripts/build-release.ps1: incrusta la interfaz (ui/) en el ejecutable.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
