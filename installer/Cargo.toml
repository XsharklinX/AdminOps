[package]
name = "adminops-setup"
# La versión que se instala sale de src-tauri/tauri.conf.json (ver build.rs).
version = "1.0.0"
description = "Instalador de AdminOps"
authors = ["David Bonilla"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.38.4"

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[features]
# La activa scripts/build-release.ps1: incrusta la interfaz (ui/) en el ejecutable.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
