name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compilar, probar y empaquetar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # El historial entero: el buscador de secretos mira también lo que se añadió alguna vez.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Tipos y bundle del frontend
        run: npm run build

      - name: Tests del frontend
        run: npm test

      # La app en marcha: abre la interfaz con el sistema simulado, recorre todas
      # las pantallas y falla si alguna se queda en blanco, enseña «Algo falló» o
      # deja errores. Las capturas quedan como artefacto.
      - name: Pruebas de la interfaz en marcha
        run: |
          npx playwright install chromium
          npm run test:ui

      - name: Capturas de la interfaz
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas-interfaz-${{ github.sha }}
          path: tests/ui/out/
          if-no-files-found: ignore

      # Reglas de hooks de React: avisan de los efectos con dependencias
      # incompletas, que TypeScript no ve. Los avisos no rompen la CI; los errores si.
      - name: Reglas de codigo
        run: npm run lint

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Segunda version de Rust fijada: es la que se verifica a mano antes de
      # publicar, y asi la CI no puede ir por delante ni por detras de ella.
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: clippy

      - name: Clippy con la version de Rust fijada
        working-directory: src-tauri
        env:
          CARGO_TARGET_DIR: target-ci
        run: cargo +1.98.1 clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib

      # Vulnerabilidades conocidas en las dependencias (RustSec y npm). IT lo
      # pregunta antes de aprobar un programa; aquí falla la CI si aparece una.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Auditoria de dependencias de Rust
        working-directory: src-tauri
        run: cargo audit

      - name: Auditoria de dependencias de la interfaz
        run: npm audit --omit=dev --audit-level=high

      # Una clave o un token pegado por error: en lo que hay ahora y en todo lo
      # que se añadió alguna vez (una clave subida ya no es secreta).
      - name: Buscar claves y secretos
        run: |
          node scripts/scan-secrets.mjs
          node scripts/scan-secrets.mjs --history

      - name: Instalador y portable
        run: npm run build:release

      # Aplica y deshace cada ajuste del catálogo en el runner (desechable) y
      # falla si alguno no vuelve EXACTAMENTE a su estado original.
      - name: Prueba de ida y vuelta del catálogo
        shell: pwsh
        run: |
          $p = Start-Process src-tauri/target/release/adminops.exe -ArgumentList '--roundtrip', "$PWD/roundtrip.json" -Wait -PassThru
          $r = Get-Content roundtrip.json -Raw | ConvertFrom-Json
          "Total $($r.total) · OK $($r.ok) · No reversibles $($r.notReversible) · Avisos $($r.warnings)"
          $r.cases | Where-Object outcome -ne 'ok' | Format-Table id, outcome, detail -Wrap | Out-String -Width 200
          if ($p.ExitCode -eq 1) { throw 'Hay ajustes que no vuelven a su estado original (ver roundtrip.json).' }
          if ($p.ExitCode -ne 0) { throw "La prueba no pudo ejecutarse (código $($p.ExitCode))." }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adminops-${{ github.sha }}
          path: |
            release/
            roundtrip.json
          if-no-files-found: ignore
